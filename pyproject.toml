[project]
name = "opensparsity"
version = "0.1.0"
description = "Open-Sparsity 都市空間指標パイプライン: Overture Maps から取得した建物・道路を指標化し、1地点 = 1画像 + SQLite 1行に集約する"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "networkx>=3.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "duckdb>=0.9",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "joblib>=1.3",
    "tqdm>=4.65",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8", "scikit-learn>=1.4"]

[project.scripts]
ops = "opensparsity.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opensparsity"]
